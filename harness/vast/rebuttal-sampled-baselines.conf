[program:rebuttal-sampled-baselines]
command=/bin/bash -c "source /workspace/rebuttal/control/vast/env.sh && export PYTHONPATH=/workspace/rebuttal/tools/nltk_3_10_3 && exec /workspace/rebuttal/envs/qwen/bin/python /workspace/rebuttal/control/scripts/run_dual_decoding.py"
directory=/workspace/rebuttal/control
autostart=false
autorestart=false
startsecs=2
startretries=0
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/rebuttal/logs/sampled-baselines.log
stdout_logfile_maxbytes=0
redirect_stderr=true
