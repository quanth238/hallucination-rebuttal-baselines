[project]
name = "vinuni-rebuttal"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.6.0",
  "torchvision==0.21.0",
  "transformers==4.57.6",
  "tokenizers==0.22.1",
  "huggingface-hub==0.36.0",
  "accelerate==1.11.0",
  "qwen-vl-utils==0.0.14",
  "safetensors==0.6.2",
  "numpy==1.26.4",
  "pillow==11.3.0",
  "nltk==3.9.2",
  "inflect==7.5.0",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

